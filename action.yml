name: 'APIVerve'
description: 'Access 350+ production-ready APIs in your GitHub workflows - QR codes, screenshots, DNS, weather, IP lookup, and more'
author: 'APIVerve'
branding:
  icon: 'zap'
  color: 'blue'

inputs:
  api_key:
    description: 'Your APIVerve API key. Can also be set via APIVERVE_API_KEY env var.'
    required: false
  api:
    description: 'The API to call (e.g., qrcodegenerator, weatherforecast, iplookup). See full list at https://apiverve.com'
    required: false
  params:
    description: 'JSON parameters to pass to the API'
    required: false
    default: '{}'
  output_file:
    description: 'Path to save binary output (for APIs that return files like QR codes, screenshots, PDFs)'
    required: false
  format:
    description: 'Response format: json, yaml, or xml'
    required: false
    default: 'json'
  check:
    description: 'Run a pass/fail check instead of a plain API call. Options: ssl-expiry, domain-expiry, dns-record, email-auth'
    required: false
    default: ''
  domain:
    description: 'Domain to check (used with check)'
    required: false
  warn_days:
    description: 'ssl-expiry/domain-expiry: warn when fewer than this many days remain (default 30 / 60)'
    required: false
  fail_days:
    description: 'ssl-expiry/domain-expiry: fail when fewer than this many days remain (default 7 / 14)'
    required: false
  fail_on_self_signed:
    description: 'ssl-expiry: fail if the certificate is self-signed'
    required: false
    default: 'false'
  record_type:
    description: 'dns-record: record type to require (A, AAAA, CNAME, MX, TXT, NS...)'
    required: false
    default: 'A'
  expected_value:
    description: 'dns-record: fail unless a record contains this value'
    required: false
  dkim_selector:
    description: 'email-auth: DKIM selector to verify (skipped if empty)'
    required: false
  require_dmarc_enforced:
    description: 'email-auth: fail unless DMARC is p=quarantine or p=reject'
    required: false
    default: 'false'
  fail_on_error:
    description: 'Whether to fail the workflow if the API returns an error'
    required: false
    default: 'true'

outputs:
  result:
    description: 'The full API response as JSON'
  data:
    description: 'The data field from the API response as JSON'
  status:
    description: 'The status of the API call (ok or error)'
  file:
    description: 'Path to the downloaded file (if output_file was specified)'
  days_remaining:
    description: 'Days until expiry (ssl-expiry, domain-expiry)'
  records:
    description: 'Matching DNS records as JSON (dns-record)'

runs:
  using: 'node24'
  main: 'dist/index.js'
